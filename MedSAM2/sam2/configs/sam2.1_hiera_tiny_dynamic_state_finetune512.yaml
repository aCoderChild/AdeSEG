# @package _global_

defaults:
  - sam2.1_hiera_tiny_finetune512
  - _self_

trainer:
  model:
    _target_: training.model.dynamic_state.ReliabilityGatedSAM2Train
    reliability_gate_hidden_dim: 32
    freeze_base_model: true
    # The first prompt frame seeds the recurrent state.  Every later frame
    # reads and updates that single state in chronological order.
    num_frames_to_correct_for_train: 1
    rand_frames_to_correct_for_train: False
    add_all_frames_to_correct_as_cond: False
    num_init_cond_frames_for_train: 1
    rand_init_cond_frames_for_train: False
    prob_to_use_pt_input_for_train: 1.0
    prob_to_use_box_input_for_train: 1.0
    prob_to_use_pt_input_for_eval: 1.0
    prob_to_use_box_input_for_eval: 1.0

  loss:
    all:
      _target_: training.model.dynamic_state.ReliabilityAwareMultiStepLoss
      weight_dict:
        loss_mask: 20
        loss_dice: 1
        loss_iou: 1
        loss_class: 1
        loss_reliability: 1

  checkpoint:
    model_weight_initializer:
      # The base MedSAM2 checkpoint has every parameter except this new head.
      strict: True
      ignore_missing_keys: ['reliability_gate.*']
