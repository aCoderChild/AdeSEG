# @package _global_

defaults:
  - sam2.1_hiera_tiny_dynamic_state_finetune512
  - _self_

polypgen:
  root: data/PolypGen2021_MultiCenterData_v3/sequenceData/positive
  train_split: MedSAM2/training/assets/polypgen/train.txt
  val_split: MedSAM2/training/assets/polypgen/val.txt
  test_split: MedSAM2/training/assets/polypgen/test.txt

scratch:
  num_frames: 8
  max_num_objects: 1
  train_video_batch_size: 1
  num_train_workers: 4
  base_lr: 1.0e-3
  vision_lr: 0.0
  num_epochs: 75

vos:
  eval_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: true
        - _target_: training.dataset.transforms.ToTensorAPI
        - _target_: training.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

trainer:
  accelerator: auto
  distributed:
    backend: null
  mode: train
  data:
    train:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      batch_sizes:
        - ${scratch.train_video_batch_size}
      datasets:
        - _target_: training.dataset.vos_dataset.VOSDataset
          transforms: ${vos.train_transforms}
          training: true
          video_dataset:
            _target_: training.dataset.vos_raw_dataset.PNGRawDataset
            img_folder: ${polypgen.root}
            gt_folder: ${polypgen.root}
            file_list_txt: ${polypgen.train_split}
            image_subdir_template: images_{video_name}
            mask_subdir_template: masks_{video_name}
            binary_mask_images: true
          sampler:
            _target_: training.dataset.vos_sampler.RandomUniformSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
          multiplier: 1
      shuffle: true
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: true
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all
    val:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: 1
      batch_sizes:
        - 1
      datasets:
        - _target_: training.dataset.vos_dataset.VOSDataset
          transforms: ${vos.eval_transforms}
          training: false
          video_dataset:
            _target_: training.dataset.vos_raw_dataset.PNGRawDataset
            img_folder: ${polypgen.root}
            gt_folder: ${polypgen.root}
            file_list_txt: ${polypgen.val_split}
            image_subdir_template: images_{video_name}
            mask_subdir_template: masks_{video_name}
            binary_mask_images: true
          sampler:
            _target_: training.dataset.vos_sampler.RandomUniformSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
          multiplier: 1
      shuffle: false
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: false
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all
  checkpoint:
    save_dir: outputs/polypgen_train/checkpoints
    save_freq: 1
    model_weight_initializer:
      state_dict:
        checkpoint_path: checkpoints/MedSAM2_latest.pt

launcher:
  gpus_per_node: 1
  experiment_log_dir: outputs/polypgen_train
