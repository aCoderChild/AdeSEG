name: Runner availability diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "GitHub runner accepted job"
      - run: python --version
      - run: uname -a
