name: Verify cleaned AdeSEG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy Pillow pytest
      - name: Compile tracked Python sources
        run: python -m compileall -q datasets evaluation modeling scripts training tests
      - name: Run focused Lean aggregation and teacher tests
        run: |
          python -m pytest -q \
            tests/test_clean_aggregation.py \
            tests/test_positive_teacher_preservation_loss.py \
            tests/test_training_foreground_preservation_v1.py \
            tests/test_multiscale_mechanism_controls_v1.py \
            tests/test_lean_multiscale_anchor.py \
            tests/test_lean_memory_position_lookup.py
      - name: Check essential submodule declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.gitmodules').read_text()
          for name in ('external/Lean-SAM2','external/sam2','external/CMSA-Net','external/SAM2Long','external/SAMURAI'):
              assert f'path = {name}' in text, f'Missing {name}'
          print('All five model submodules declared')
          PY
