name: Verify AdeSEG research core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-compatible test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy Pillow pytest opencv-python-headless pyyaml tqdm hydra-core iopath timm loguru einops
      - name: Report environment
        run: |
          python - <<'PY'
          import sys, torch, numpy, pytest
          print("Python:", sys.version)
          print("PyTorch:", torch.__version__, "CUDA available:", torch.cuda.is_available())
          print("NumPy:", numpy.__version__, "pytest:", pytest.__version__)
          PY
      - name: Compile source
        run: python -m compileall -q adeseg datasets evaluation modeling scripts training tests
      - name: Run complete CPU test suite
        run: python -m pytest -q tests --junitxml=build/pytest.xml
      - name: Upload CPU test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-pytest-${{ github.sha }}
          path: build/pytest.xml
          if-no-files-found: warn
      - name: Verify five reference submodules
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          declared = Path('.gitmodules').read_text()
          required = ('external/Lean-SAM2', 'external/sam2', 'external/CMSA-Net', 'external/SAM2Long', 'external/SAMURAI')
          for path in required:
              assert f'path = {path}' in declared, f'missing {path} declaration'
              assert subprocess.check_output(['git', 'ls-tree', 'HEAD', path]).decode().startswith('160000 commit '), f'missing {path} gitlink'
          print('All five reference models are pinned')
          PY
