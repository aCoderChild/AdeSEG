name: Verify AdeSEG research core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy Pillow pytest
      - name: Compile source
        run: python -m compileall -q adeseg datasets evaluation modeling scripts training tests
      - name: Validate scientific interfaces and historical compatibility
        run: |
          python -m pytest -q \
            tests/test_scientific_public_api.py \
            tests/test_feature_aggregation_compatibility.py \
            tests/test_structured_feature_aggregation.py \
            tests/test_medsam2_checkpoint_identity.py \
            tests/test_medical_highres_contribution.py \
            tests/test_medical_highres_training.py \
            tests/test_api.py \
            tests/test_cmsa_image_only.py \
            tests/test_split_guard.py \
            tests/test_clean_aggregation.py \
            tests/test_positive_teacher_preservation_loss.py \
            tests/test_training_foreground_preservation_v1.py \
            tests/test_multiscale_mechanism_controls_v1.py \
            tests/test_lean_multiscale_anchor.py \
            tests/test_lean_memory_position_lookup.py
      - name: Verify five reference submodules
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          declared = Path('.gitmodules').read_text()
          required = ('external/Lean-SAM2', 'external/sam2', 'external/CMSA-Net', 'external/SAM2Long', 'external/SAMURAI')
          for path in required:
              assert f'path = {path}' in declared, f'missing {path} declaration'
              assert subprocess.check_output(['git', 'ls-tree', 'HEAD', path]).decode().startswith('160000 commit '), f'missing {path} gitlink'
          print('All five reference models are pinned')
          PY
